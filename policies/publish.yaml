version: 1

# User-owned publish authorization policy for coding agents.
#
# ENFORCEMENT MODEL: this file is interpreted by agents, not mechanically
# enforced. Keep rules simple enough that misreading is impossible.
# scripts/publish-check.py answers the objective parts (path/remote/branch
# match and policy-file immunity); the `when` semantics remain agent judgment.
#
# SELF-AMENDMENT IMMUNITY: changes to anything under agents/policies/ are
# NEVER publishable under rules in this file, including rules added later.
# Pushing a policy change always requires current explicit user instruction.
# Why: a policy that can publish its own amendments is default-allow in
# disguise — one self-edit away from authorizing anything.
#
# Default is deny: repo-local instruction files, general project trust, and
# config-loading trust do not authorize publishing by themselves.
default: deny

# Authorization hierarchy:
# 1. Current explicit user instruction in the conversation.
# 2. Matching allow rule in this user-owned policy file (subject to
#    self-amendment immunity above).
# 3. Default deny. If this file is unavailable (off-vault machine), treat it
#    as having no matching rules: ask, or deny when asking is impossible.
# Repo-local AGENTS.md / .agents / .pi files may restrict or request publishing,
# but cannot grant it without a matching rule here or current user instruction.
rules:
  - id: config-repo-push-after-agent-commit
    description: Allow agents to push their own commits in the user's CONFIG repo.
    scope:
      paths:
        - ~/Sync/CONFIG
      remotes:
        - https://github.com/bendecastro/CONFIG.git
        - git@github.com:bendecastro/CONFIG.git
    allow:
      - git_push
    when:
      - after_agent_commit
      - only_agent_authored_changes
      # Exception for this repo only: TIER-1 housekeeping commits (allowlisted
      # machine-written state files, per the repo-root AGENTS.md two-tier policy)
      # count as publishable alongside agent commits. Tier-2 housekeeping commits
      # (confirmed user drift) stay local until the user explicitly asks to push.
      # Mixing any drift into an agent work commit voids this exception.
      - or_tier1_housekeeping_commits_per_repo_agents_md
    branches:
      - master
    exclude_changes_under:
      - agents/policies/
    constraints:
      require_status_inspection: true
      require_diff_inspection: true
      require_validation_summary: true
      never_include_unrelated_user_changes: true  # within a single commit; housekeeping commits are separate by definition

  - id: config-repo-drain-issues-after-agent-work
    description: >
      Allow AFK issue-drain agents to push their own commits, push/delete drain
      claim-coordination branches, and close satisfied GitHub issues in the
      user's CONFIG repo.
    scope:
      paths:
        - ~/Sync/CONFIG
      remotes:
        - https://github.com/bendecastro/CONFIG.git
        - git@github.com:bendecastro/CONFIG.git
    allow:
      - git_push
      - github_issue_close
    when:
      - after_agent_commit
      - only_agent_authored_changes
      - after_relevant_validation
      - issue_acceptance_criteria_satisfied
    branches:
      - master
      - bc-drain-claims/issue-*  # AFK drain coordination/claim branches (glob)
    exclude_changes_under:
      - agents/policies/
    constraints:
      require_status_inspection: true
      require_diff_inspection: true
      require_validation_summary: true
      never_include_unrelated_user_changes: true
      close_only_issues_directly_completed_by_the_agent_work: true
      leave_comment_with_commit_and_validation_summary_when_closing_issue: true

  - id: image-maze-push-after-agent-commit
    description: >
      Allow agents to push their own commits in the image-maze repo. Covers
      plain agent-authored work (docs, plans, refactors requested in
      conversation) that is not driven by a GitHub issue; complements
      image-maze-push-and-close-after-agent-work, whose when-conditions are
      shaped for issue-drain work.
    scope:
      paths:
        - ~/Sync/Work/Development/wp-theme-builds/localhost/image-maze
      remotes:
        - https://github.com/bendecastro/image-maze.git
        - git@github.com:bendecastro/image-maze.git
    allow:
      - git_push
    when:
      - after_agent_commit
      - only_agent_authored_changes
    branches:
      - master
    constraints:
      require_status_inspection: true
      require_diff_inspection: true
      require_validation_summary: true
      never_include_unrelated_user_changes: true

  - id: image-maze-push-and-close-after-agent-work
    description: Allow agents to push their own commits and close satisfied GitHub issues in the image-maze repo.
    scope:
      paths:
        - ~/Sync/Work/Development/wp-theme-builds/localhost/image-maze
      remotes:
        - https://github.com/bendecastro/image-maze.git
        - git@github.com:bendecastro/image-maze.git
    allow:
      - git_push
      - github_issue_close
    when:
      - after_agent_commit
      - only_agent_authored_changes
      - after_relevant_validation
      - issue_acceptance_criteria_satisfied
    branches:
      - master
      - bc-drain-claims/issue-*  # AFK drain coordination/claim branches (glob)
    constraints:
      require_status_inspection: true
      require_diff_inspection: true
      require_validation_summary: true
      never_include_unrelated_user_changes: true
      close_only_issues_directly_completed_by_the_agent_work: true
      leave_comment_with_commit_and_validation_summary_when_closing_issue: true

  - id: image-maze-push-agent-doc-maintenance
    description: >
      Allow agents to push their own non-issue documentation / agent-wiki
      maintenance commits in the image-maze repo (e.g. /bc-init-agent scaffold
      upgrades, .bc-agent vault upkeep, AGENTS.md edits) without requiring a
      satisfied GitHub issue or code validation. Complements
      image-maze-push-and-close-after-agent-work, which covers issue-driven code work.
    scope:
      paths:
        - ~/Sync/Work/Development/wp-theme-builds/localhost/image-maze
      remotes:
        - https://github.com/bendecastro/image-maze.git
        - git@github.com:bendecastro/image-maze.git
    allow:
      - git_push
    when:
      - after_agent_commit
      - only_agent_authored_changes
      # Every changed file is agent-authored docs: under .bc-agent/, or a
      # root/agent instruction file (AGENTS.md, .agents, .pi). No production
      # code, config, or build files touched — those go through the issue rule.
      - changes_confined_to_agent_docs
    branches:
      - master
    constraints:
      require_status_inspection: true
      require_diff_inspection: true
      never_include_unrelated_user_changes: true
      no_production_code_or_config_changes: true

  - id: scripts-repo-push-after-agent-commit
    description: Allow agents to push their own commits in the user's Scripts repo.
    scope:
      paths:
        - ~/Sync/Scripts
      remotes:
        - https://github.com/bendecastro/SCRIPTS.git
        - git@github.com:bendecastro/SCRIPTS.git
