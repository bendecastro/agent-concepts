# Runs the full gate on a clean checkout. Before landing, check the latest trunk run.
name: gate
on:
  push:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest hypothesis
      - run: scripts/gate
