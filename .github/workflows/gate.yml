# Runs the full gate on a clean checkout. Before landing, check the latest trunk run.
name: gate
on:
  push:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # test_visible_layout.py reads a historical base commit; a shallow clone skips those tests.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # run-promotion-all.sh needs GNU timeout; Ubuntu 26.04 defaults to uutils and ships GNU's as gnutimeout.
      - run: sudo apt-get install -y gnu-coreutils
      - run: pip install pytest hypothesis
      - run: scripts/gate
