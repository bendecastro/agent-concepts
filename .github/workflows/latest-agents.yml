# Detect upstream CLI changes between releases, not just on pushes.
name: latest agents
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  fresh-install:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install latest CLIs
        run: npm install -g @earendil-works/pi-coding-agent@latest @anthropic-ai/claude-code@latest @openai/codex@latest skills@latest
      - name: Test fresh installs
        run: python3 scripts/fresh_install_test.py
  report-failure:
    needs: fresh-install
    if: ${{ failure() && needs.fresh-install.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    concurrency:
      group: latest-agents-failure-report
      cancel-in-progress: false
    steps:
      - name: Report failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Latest agent CLIs: fresh-install test failed';
            const { owner, repo } = context.repo;
            const body = `Fresh-install compatibility failed: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const issue = issues.find(i => !i.pull_request && i.title === title);
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
